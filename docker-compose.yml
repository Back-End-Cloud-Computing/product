services:
  product-api:
    build: .
    container_name: product-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      - mongodb
      - chromadb
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - product-net

  mongodb:
    image: mongo:7
    container_name: product-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - product-net

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: product-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - product-net

volumes:
  mongo_data:
  chroma_data:
  hf_cache:

networks:
  product-net:
    driver: bridge
