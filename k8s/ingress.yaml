# Entrada HTTP externa para o product-api.
#
# Mesmo padrão do authorization/k8s/ingress.yaml: roteamento por HOST, então
# /products, /docs, /health etc. continuam funcionando sem prefixo, do jeito
# que o código já espera.
#
# Só as rotas públicas são listadas. /internal (estoque, chamado pelo order
# dentro do cluster) e /metrics ficam de fora de propósito: alcançáveis só
# pelo Service, nunca pela borda.
#
# O Ingress aponta para o SERVICE, nunca para um Pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-api-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: product.ganjj.local
      http:
        paths:
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: product-api
                port:
                  number: 8000
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: product-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: product-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: product-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: product-api
                port:
                  number: 8000
